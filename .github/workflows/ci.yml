name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Upstream suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.403
    - name: Test against Microsoft's suite
      run: >-
        scripts/test-upstream --verbosity minimal
        --blame-hang-timeout 30s --blame-hang-dump-type mini

  publish:
    name: Publish package
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.403
    - name: Pack
      run: dotnet pack src/ILLink.RoslynAnalyzer/ILLink.RoslynAnalyzer.csproj -c Release -o artifacts/package
    - name: Sign in to nuget.org through trusted publishing
      id: nuget
      uses: NuGet/login@v1
      with:
        user: andridavelo
    # A version that is already published is skipped, so only a change to <Version> publishes.
    - name: Push to nuget.org
      run: >-
        dotnet nuget push "artifacts/package/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
        --skip-duplicate
